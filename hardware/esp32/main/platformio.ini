[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_extra_dirs = .
lib_deps =
    marcoschwartz/LiquidCrystal_I2C
    bblanchon/ArduinoJson@^6.21.4
    links2004/WebSockets@^2.4.1
; La pila por defecto de loopTask (8 KB) se desbordaba durante la autenticación
; WebSocket (Stack canary watchpoint triggered). Se duplica y se decodifican
; los backtraces automáticamente en el monitor.
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384
monitor_filters = esp32_exception_decoder
